name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract latest Stage ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'TMS_Video_Generator_Cloud_Stage*.zip' | sort -V | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No Stage ZIP file found."
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          mkdir -p build-project
          unzip -q "$ZIP_FILE" -d build-project

      - name: Find Gradle project
        run: |
          SETTINGS_FILE=$(find build-project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "No Gradle settings file found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Android app
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TMS-Video-Generator-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
